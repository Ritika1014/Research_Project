<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="90" height="90">
  <defs>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Pulse Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="60" cy="60" r="50" fill="#0A1628" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Left Hemisphere Brain Lobes -->
  <path d="M 58 24 C 44 24 32 32 30 44 C 26 48 24 54 26 62 C 24 70 28 78 34 82 C 38 88 48 94 58 94"
        fill="none" stroke="url(#cyanBlueGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right Hemisphere Brain Lobes -->
  <path d="M 62 24 C 76 24 88 32 90 44 C 94 48 96 54 94 62 C 96 70 92 78 86 82 C 82 88 72 94 62 94"
        fill="none" stroke="url(#cyanBlueGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Fissure Axis -->
  <line x1="60" y1="22" x2="60" y2="96" stroke="#4FD1FF" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Neural Network Synapse Lines (Left) -->
  <line x1="40" y1="40" x2="52" y2="48" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="52" y1="48" x2="38" y2="60" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="38" y1="60" x2="50" y2="72" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="72" x2="42" y2="82" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="52" y1="48" x2="60" y2="54" stroke="#4FD1FF" stroke-width="1.4" opacity="0.8"/>
  <line x1="50" y1="72" x2="60" y2="68" stroke="#4FD1FF" stroke-width="1.4" opacity="0.8"/>

  <!-- Neural Network Synapse Lines (Right) -->
  <line x1="80" y1="40" x2="68" y2="48" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="68" y1="48" x2="82" y2="60" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="82" y1="60" x2="70" y2="72" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="70" y1="72" x2="78" y2="82" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="68" y1="48" x2="60" y2="54" stroke="#4FD1FF" stroke-width="1.4" opacity="0.8"/>
  <line x1="70" y1="72" x2="60" y2="68" stroke="#4FD1FF" stroke-width="1.4" opacity="0.8"/>

  <!-- Synaptic Nodes (Glowing Cyan Circles) -->
  <circle cx="40" cy="40" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>
  <circle cx="52" cy="48" r="3" fill="#60A5FA"/>
  <circle cx="38" cy="60" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>
  <circle cx="50" cy="72" r="3" fill="#60A5FA"/>
  <circle cx="42" cy="82" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>

  <circle cx="80" cy="40" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>
  <circle cx="68" cy="48" r="3" fill="#60A5FA"/>
  <circle cx="82" cy="60" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>
  <circle cx="70" cy="72" r="3" fill="#60A5FA"/>
  <circle cx="78" cy="82" r="3.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>

  <!-- Central Processing Core Nodes -->
  <circle cx="60" cy="54" r="4.5" fill="#38BDF8" filter="url(#cyanGlow)"/>
  <circle cx="60" cy="68" r="4.5" fill="#4FD1FF" filter="url(#cyanGlow)"/>
  <circle cx="60" cy="54" r="2" fill="#FFFFFF"/>
  <circle cx="60" cy="68" r="2" fill="#FFFFFF"/>
</svg>
